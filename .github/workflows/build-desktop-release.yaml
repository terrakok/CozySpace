name: Build Desktop Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64

          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64

          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@main
        with:
          jbr-version: '25.0.2b329.66'
          packaging-tools: 'true'
          flatpak: 'true'
          setup-gradle: 'true'
          setup-node: 'true'
      - name: Build with Gradle
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="1.0.0"
          fi
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS -PappVersion=$VERSION -i --stacktrace --no-daemon
      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-logs-${{ matrix.os }}
          path: |
            desktopApp/build/compose/logs/createReleaseDistributable/*-out.txt
            desktopApp/build/compose/logs/createReleaseDistributable/*-err.txt
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.flatpak
            !desktopApp/build/compose/binaries/**/app/**
            !desktopApp/build/compose/binaries/**/runtime/**
