name: Build Desktop Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64

          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64

          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '25'
          cache: 'gradle'
      - name: Install Flatpak (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Build with Gradle
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="1.0.0"
          fi
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS -PappVersion=$VERSION -i --stacktrace --no-daemon
      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-logs-${{ matrix.os }}
          path: |
            desktopApp/build/compose/logs/createReleaseDistributable/*-out.txt
            desktopApp/build/compose/logs/createReleaseDistributable/*-err.txt
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/**/*.dmg
            build/compose/binaries/**/*.msi
            build/compose/binaries/**/*.deb
            build/compose/binaries/**/*.rpm
            build/compose/binaries/**/*.flatpak
            !build/compose/binaries/**/app/**
            !build/compose/binaries/**/runtime/**
